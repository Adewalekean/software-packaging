name: Node.js CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    container:
      image: node:22-alpine

    defaults:
      run:
        working-directory: nodejs-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Alpine environment
        run: |
          cat /etc/os-release
          node --version
          npm --version

      - name: Verify application files
        run: |
          pwd
          ls -la
          test -f package.json
          test -f package-lock.json
          echo "Application files verified"

      - name: Install dependencies
        run: npm ci

      - name: Verify dependencies
        run: npm ls --depth=0
