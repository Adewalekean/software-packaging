name: Node.js CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    container:
      image: node:22-alpine

    defaults:
      run:
        working-directory: nodejs-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GNU tar
        run: |
          apk add --no-cache tar
          tar --version

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-alpine-${{ hashFiles('nodejs-app/package-lock.json') }}
          restore-keys: |
            npm-alpine-

      - name: Check Alpine environment
        run: |
          cat /etc/os-release
          node --version
          npm --version

      - name: Verify application files
        run: |
          test -f package.json
          test -f package-lock.json
          echo "Application files verified"

      - name: Install dependencies
        run: npm ci

      - name: Verify dependencies
        run: npm ls --depth=0
      
      - name: Security audit
        run: npm audit --omit=dev --audit-level=high

      - name: Run automated tests
        run: npm test

      - name: Package Node.js application
        run: npm pack

      - name: Generate SHA-256 checksum
        run: |
          sha256sum nodejs-app-1.0.0.tgz > nodejs-app-1.0.0.tgz.sha256

      - name: Verify package integrity
        run: |
          sha256sum -c nodejs-app-1.0.0.tgz.sha256

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nodejs-app-package
          path: |
            nodejs-app/nodejs-app-1.0.0.tgz
            nodejs-app/nodejs-app-1.0.0.tgz.sha256
          if-no-files-found: error
