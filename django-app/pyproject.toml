[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-packaging-demo"
version = "1.0.0"
description = "A simple Django application for learning software packaging"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.2,<5.3"
]

[tool.setuptools.packages.find]
include = ["config*", "webapp*"]